# iq.lab — dev-iqlab.lokalatdev.cloud (Tailscale-Only HTTPS Proxy to MiniPC)

# HTTP Redirect to HTTPS
server {
    listen 100.71.144.89:80;
    server_name dev-iqlab.lokalatdev.cloud;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 100.71.144.89:443 ssl;
    server_name dev-iqlab.lokalatdev.cloud;

    charset utf-8;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/dev-iqlab.lokalatdev.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-iqlab.lokalatdev.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy all traffic to the MiniPC Vite server over Tailscale
    location / {
        proxy_pass         http://100.81.71.45:5173;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # Support WebSockets (critical for Vite's HMR)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "microphone=(self)" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
