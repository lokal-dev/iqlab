# iq.lab — Public Production (iqlab.lokalatdev.cloud)
server {
    listen 203.194.115.246:80;
    server_name iqlab.lokalatdev.cloud;

    charset utf-8;
    disable_symlinks off;

    # ── React SPA (Vite dist/) ─────────────────────────────────
    location / {
        alias /home/backdoor/projects/iqlab-dev/dist/;
        disable_symlinks off;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI Backend (/api/) ────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # ── Static asset caching ───────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf)$ {
        alias /home/backdoor/projects/iqlab-dev/dist/;
        disable_symlinks off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Security headers ───────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "microphone=(self)" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }
}
