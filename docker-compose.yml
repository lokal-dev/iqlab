version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: iqlab_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iqlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iqlab_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/iqlab
      - WHISPER_MODEL=small
    depends_on:
      - db
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    image: node:20-slim
    container_name: iqlab_frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    # Runs npm install and starts Vite dev server with host binding
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
