# iq.lab — iqlab.lokalatdev.cloud
# Redirect HTTP → HTTPS
server {
    listen 203.194.115.246:80;
    server_name iqlab.lokalatdev.cloud www.iqlab.lokalatdev.cloud;

    # Allow ACME challenge for certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/maintenance;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — iq.lab React SPA
server {
    listen 203.194.115.246:443 ssl http2;
    server_name iqlab.lokalatdev.cloud www.iqlab.lokalatdev.cloud;

    # SSL — provisioned by certbot (run after initial nginx reload)
    ssl_certificate     /etc/letsencrypt/live/iqlab.lokalatdev.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iqlab.lokalatdev.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    disable_symlinks off;

    # ── React SPA (Vite dist/) ─────────────────────────────────
    location / {
        alias /home/backdoor/projects/iqlab/dist/;
        disable_symlinks off;
        index index.html;
        # SPA fallback — all routes serve index.html
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI Backend (/api/) ────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # ── Static asset caching ───────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf)$ {
        alias /home/backdoor/projects/iqlab/dist/;
        disable_symlinks off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Security headers ───────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "microphone=(self)" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }
}
